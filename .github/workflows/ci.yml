name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # build script is "tsc && vite build" — typecheck plus production build
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test

  # Image smoke test: run the built UI image against a 401-stub backend and
  # assert SPA serving, health, config and the unauthenticated proxy path.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build UI image (loaded into docker, gha-cached)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: claude-memory-ui:smoke
          build-args: |
            VERSION=smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container smoke test
        run: |
          docker network create smoke
          docker run -d --name stub401 --network smoke \
            -v "$PWD/tests:/stub:ro" python:3.15-slim python /stub/stub401.py
          docker run -d --name ui --network smoke -p 8081:8081 \
            -e MCP_INTERNAL_URL=http://stub401:8080 -e BEARER_TOKEN=smoke-proxy-token \
            claude-memory-ui:smoke
          docker run -d --name ui2 --network smoke -p 8082:8081 \
            -e MCP_INTERNAL_URL=http://stub401:8080 \
            claude-memory-ui:smoke
          bash tests/smoke.sh
      - name: Collect container logs on failure
        if: failure()
        run: |
          { docker logs ui; docker logs ui2; docker logs stub401; } > container-logs.txt 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: container-logs
          path: container-logs.txt

  # Single stable check to require once branch protection/rulesets are available
  # (Free plan blocks them while private). Fails if any required job did not succeed.
  ci-success:
    runs-on: ubuntu-latest
    needs: [build, lint, test, smoke]
    if: always()
    steps:
      - name: All required jobs succeeded?
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled|skipped'; then
            echo "one or more required jobs did not succeed" >&2
            exit 1
          fi
