name: build-and-push

on:
  push:
    branches: [main]
  schedule:
    # Registry GC runs nightly and eats multi-arch manifest children.
    # Rebuild + push every 6h so fresh layers are always present.
    - cron: '30 */6 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.example.internal
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: registry.example.internal/first-it-consulting/claude-memory-ui
          tags: |
            type=raw,value=latest
            type=raw,value=rolling

      - uses: docker/bake-action@v4
        with:
          targets: image-all
          set: |
            *.tags=${{ steps.meta.outputs.tags }}
            *.labels.${{ steps.meta.outputs.labels }}
