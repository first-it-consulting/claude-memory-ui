name: Release

# release-please keeps a release PR up to date from conventional commits.
# Merging that PR creates the vX.Y.Z tag and the GitHub release. Image
# publishing is a separate, not-yet-enabled step.
# Known limitation (mirrors harness-control-center): PRs created with
# GITHUB_TOKEN do not trigger workflows, so CI checks never run on the
# release PR itself - review it manually before merging.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # manual dispatch from a non-main ref must not run privileged steps
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      # to dispatch the publish workflow for the freshly created tag
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created tags do not trigger workflow pushes; dispatch
      # publish explicitly. publish.yml gates dispatch on refs/tags/v*.
      - name: Trigger publish for the created tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --ref "$TAG"

