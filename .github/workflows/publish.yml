name: publish

# The build job runs on EVERY trigger (PR, dispatch, release tag): build +
# Trivy CRITICAL gate + SBOM, on one fast architecture. On a release tag it
# acts as the pre-push gate - the publish job needs it, so a vulnerable
# image can never reach the registry.
# Publish (tags only, human-merged release PRs after the history rewrite):
# push vX.Y.Z, rescan the pushed digest, and only then move :rolling.
# Registry + token policy per bean 0op6: GHCR via the built-in GITHUB_TOKEN
# - no personal access token anywhere. Buildkit provenance/SBOM attestations
# are image-attached and need only packages: write.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/first-it-consulting/claude-memory-ui

jobs:
  # Build + gate. Never pushes; on tags this must pass before publish starts.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (load into docker for scanning, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan - fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-critical.sarif
      - name: Scan - report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:ci
          severity: HIGH
          exit-code: "0"
          format: table
      - name: Generate SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json "${IMAGE}:ci"
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-results
          path: |
            trivy-critical.sarif
            sbom.cdx.json
          if-no-files-found: warn

  # Release tags only, after the build gate passed. Push the version tag,
  # rescan what actually landed in the registry, move :rolling only at the
  # very end so it never points at an image that failed a check.
  publish:
    needs: build
    # tag pushes fire this directly; release-please tags are created with
    # GITHUB_TOKEN which does NOT emit triggerable push events, so Release
    # dispatches this workflow with --ref <tag> (dispatch may follow
    # GITHUB_TOKEN events). NOTE: dispatch uses the workflow file AT the tag
    # ref, so this only helps tags created after this fix landed.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push version tag, multi-arch, with provenance + SBOM attestations
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan pushed image - fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-critical.sarif
      - name: Scan pushed image - report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH
          exit-code: "0"
          format: table
      - name: Move rolling tag (only after every check passed)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create -t "${IMAGE}:rolling" "${IMAGE}@${DIGEST}"
      - name: Digest summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Image digest"
            echo "- image: \`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- :rolling moved to this digest"
          } >> "$GITHUB_STEP_SUMMARY"
