name: renovate

on:
  # Cron parked: re-enable once RENOVATE_TOKEN has Issues read+write
  # (bean claude-memory-hi07). Until then dispatch manually.
  # schedule:
  #   # every 6 hours
  #   - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: false
        default: "info"
        type: choice
        options: [debug, info, warn, error]

permissions:
  contents: write      # push update branches
  pull-requests: write # open/update PRs

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
