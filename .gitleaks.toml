title = "gitleaks: catch real claude-memory tokens, allow narrow fakes"

# Real personal tokens are cm_t<8hex>_<long url-safe secret>. Anything of that
# shape OUTSIDE the allowlisted fixture files below is a leak - including in
# tests, which must keep using obviously-fake short variants.
[[rules]]
id = "claude-memory-personal-token"
description = "claude-memory personal API token shape (cm_t + 8 hex + 20+ url-safe chars)"
regex = '''\bcm_t[0-9a-f]{8}_[A-Za-z0-9_-]{20,}'''
keywords = ["cm_t"]

[allowlist]
description = "test fixtures that intentionally hold fake tokens (short fakes only - the custom rule above still fires on real-shape strings here)"
paths = [
  '''(^|/)tests/test_api_tokens\.py$''',
  '''(^|/)tests/test_units\.py$''',
  '''(^|/)ui/src/api/tokens\.test\.ts$''',
]
