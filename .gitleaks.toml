title = "gitleaks: built-in rules + claude-memory token shape"

# Without [extend] a custom config REPLACES the built-in ruleset - generic
# secrets (GitHub PATs, cloud keys, private keys, JWTs...) would go unscanned.
[extend]
useDefault = true

# Real personal tokens are cm_t<8hex>_<long url-safe secret>. Anything of that
# shape anywhere in the repo is a leak - tests must use obviously-fake short
# variants that stay below the 20-char secret threshold.
[[rules]]
id = "claude-memory-personal-token"
description = "claude-memory personal API token shape (cm_t + 8 hex + 20+ url-safe chars)"
regex = '''\bcm_t[0-9a-f]{8}_[A-Za-z0-9_-]{20,}'''
keywords = ["cm_t"]

[allowlist]
description = "test fixtures that intentionally hold fake tokens"
paths = [
  '''(^|/)tests/test_api_tokens\.py$''',
  '''(^|/)tests/test_units\.py$''',
  '''(^|/)ui/src/api/tokens\.test\.ts$''',
]
